<style>
  :root {
    /* ===== Vibrant green / neon / cyber palette ===== */
    --background: 158 60% 4%;
    --foreground: 150 30% 96%;
    --card: 158 45% 8%;
    --primary: 150 95% 55%;          /* neon green */
    --primary-foreground: 158 60% 4%;
    --primary-glow: 165 100% 50%;    /* mint cyan */
    --primary-deep: 142 80% 35%;     /* deep emerald */
    --secondary: 158 35% 12%;
    --muted-foreground: 150 18% 72%;
    --accent: 75 95% 55%;            /* lime electric */
    --accent-2: 175 90% 55%;         /* teal */
    --border: 150 30% 18%;
    --gradient-primary: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
    --gradient-vibrant: linear-gradient(135deg, hsl(var(--accent)) 0%, hsl(var(--primary)) 50%, hsl(var(--primary-glow)) 100%);
    --shadow-card: 0 10px 30px hsl(150 100% 30% / 0.15), 0 0 0 1px hsl(var(--primary) / 0.05);
    --shadow-elevated: 0 20px 50px -18px hsl(var(--primary) / 0.55), 0 0 30px hsl(var(--primary) / 0.15);
    --shadow-glow: 0 0 24px hsl(var(--primary) / 0.5);
  }
  .light {
    --background: 150 40% 97%;
    --foreground: 158 60% 8%;
    --card: 0 0% 100%;
    --primary: 150 80% 35%;
    --primary-foreground: 0 0% 100%;
    --primary-glow: 170 80% 38%;
    --primary-deep: 142 70% 28%;
    --secondary: 150 30% 92%;
    --muted-foreground: 158 18% 35%;
    --accent: 80 70% 40%;
    --accent-2: 175 70% 38%;
    --border: 150 25% 85%;
    --shadow-card: 0 10px 30px hsl(150 40% 25% / 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
    font-weight: 500;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  html[dir="ltr"] body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  html[dir="ltr"] h1, html[dir="ltr"] h2, html[dir="ltr"] h3, html[dir="ltr"] h4 { letter-spacing: -0.03em; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }
  ::selection { background: hsl(var(--primary) / 0.4); color: hsl(var(--background)); }

  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .text-primary { color: hsl(var(--primary)); }
  .text-muted { color: hsl(var(--muted-foreground)); }
  .gradient-bg { background: var(--gradient-primary); }
  .gradient-vibrant { background: var(--gradient-vibrant); }
  .gradient-text {
    background: var(--gradient-vibrant);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px hsl(var(--primary) / 0.35));
  }

  /* ============ ANIMATED BACKGROUND ============ */
  /* Matrix code rain canvas */
  #matrix {
    position: fixed; inset: 0; z-index: -3; pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .light #matrix { opacity: 0.18; mix-blend-mode: multiply; }

  .bg-fx {
    position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse 75% 55% at 50% 0%, hsl(var(--primary) / 0.22), transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% 78%, hsl(var(--accent) / 0.18), transparent 60%),
      radial-gradient(ellipse 55% 45% at 12% 65%, hsl(var(--primary-glow) / 0.18), transparent 60%);
  }
  .bg-fx::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(hsl(var(--primary) / 0.08) 1px, transparent 1px),
      linear-gradient(90deg, hsl(var(--primary) / 0.08) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 30%, black, transparent 80%);
    mask-image: radial-gradient(ellipse 95% 75% at 50% 30%, black, transparent 80%);
    opacity: 0.7;
    animation: grid-move 30s linear infinite;
  }
  @keyframes grid-move { to { background-position: 48px 48px, 48px 48px; } }

  /* Animated blobs */
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 9999px; filter: blur(90px);
    opacity: 0.5; will-change: transform;
    mix-blend-mode: screen;
  }
  .light .blob { mix-blend-mode: multiply; opacity: 0.25; }
  .blob-1 { width: 480px; height: 480px; background: hsl(var(--primary) / 0.7); top: -160px; inset-inline-end: -120px; animation: blob-a 18s ease-in-out infinite; }
  .blob-2 { width: 420px; height: 420px; background: hsl(var(--accent) / 0.55); top: 35%; inset-inline-start: -160px; animation: blob-b 22s ease-in-out infinite; }
  .blob-3 { width: 380px; height: 380px; background: hsl(var(--primary-glow) / 0.55); bottom: -120px; inset-inline-end: 25%; animation: blob-c 20s ease-in-out infinite; }
  .blob-4 { width: 320px; height: 320px; background: hsl(var(--accent-2) / 0.45); top: 60%; inset-inline-end: 10%; animation: blob-a 26s ease-in-out infinite reverse; }
  @keyframes blob-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,30px) scale(1.12); } }
  @keyframes blob-b { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-30px) scale(1.15); } }
  @keyframes blob-c { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-40px) scale(1.1); } }

  /* Floating code snippets in background */
  .code-snippets { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .snippet {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: hsl(var(--primary) / 0.55);
    background: hsl(var(--card) / 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid hsl(var(--primary) / 0.25);
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    white-space: pre;
    box-shadow: 0 8px 24px hsl(0 0% 0% / 0.3), inset 0 0 12px hsl(var(--primary) / 0.08);
    animation: snippet-float linear infinite;
    will-change: transform;
    text-shadow: 0 0 8px hsl(var(--primary) / 0.4);
  }
  @keyframes snippet-float {
    0%   { transform: translateY(0) rotate(-2deg); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.85; }
    100% { transform: translateY(-115vh) rotate(3deg); opacity: 0; }
  }

  /* Floating language icons in background */
  .floating-icons { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .float-icon {
    position: absolute; width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: hsl(var(--card) / 0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid hsl(var(--primary) / 0.3);
    box-shadow: 0 8px 24px hsl(0 0% 0% / 0.3), 0 0 16px hsl(var(--primary) / 0.15);
    opacity: 0.8;
    animation: float-up linear infinite;
    will-change: transform;
  }
  .float-icon svg { width: 28px; height: 28px; }
  @keyframes float-up {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.8; }
    92%  { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  /* Aurora beam */
  .beam {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, hsl(var(--primary-glow) / 0.1) 50%, transparent 62%);
    animation: beam-sweep 14s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes beam-sweep { 0% { transform: translateX(-30%); } 100% { transform: translateX(30%); } }

  /* Scanline overlay */
  .scanlines {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      hsl(var(--primary) / 0.025) 3px,
      transparent 4px
    );
    mix-blend-mode: overlay;
  }
  .light .scanlines { display: none; }

  .glass {
    background: hsl(var(--card) / 0.6);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid hsl(var(--border));
    border-radius: 1.5rem;
    box-shadow: var(--shadow-card);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute; top: 0; inset-inline-start: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.6), transparent);
    opacity: 0.5;
  }
  .glass:hover {
    transform: translateY(-4px);
    border-color: hsl(var(--primary) / 0.6);
    box-shadow: var(--shadow-elevated);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-weight: 700; padding: 0.8rem 1.6rem;
    border-radius: 1rem; transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    border: 1px solid transparent;
    position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: var(--gradient-vibrant);
    color: hsl(var(--background));
    box-shadow: 0 8px 24px hsl(var(--primary) / 0.35), 0 0 0 1px hsl(var(--primary) / 0.4);
  }
  .btn-primary:hover { box-shadow: 0 14px 36px hsl(var(--primary) / 0.55), 0 0 0 1px hsl(var(--primary) / 0.6); }
  .btn-secondary {
    background: hsl(var(--secondary));
    border-color: hsl(var(--primary) / 0.25);
    color: hsl(var(--foreground));
  }
  .btn-secondary:hover { border-color: hsl(var(--primary) / 0.6); background: hsl(var(--primary) / 0.08); }

  .icon-btn {
    width: 2.5rem; height: 2.5rem; border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: hsl(var(--secondary)); border: 1px solid hsl(var(--primary) / 0.25);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .icon-btn:hover { transform: translateY(-2px); border-color: hsl(var(--primary) / 0.7); background: hsl(var(--primary) / 0.12); box-shadow: 0 0 16px hsl(var(--primary) / 0.3); }

  .chip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    padding: 0.4rem 0.8rem; border-radius: 0.6rem;
    background: hsl(var(--secondary)); border: 1px solid hsl(var(--primary) / 0.2);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .chip:hover { border-color: hsl(var(--primary) / 0.6); transform: translateY(-1px); }
  .chip .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; position: relative; z-index: 1; }

  header {
    position: sticky; top: 0; z-index: 50;
    background: hsl(var(--background) / 0.7);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid hsl(var(--primary) / 0.2);
    box-shadow: 0 1px 24px hsl(var(--primary) / 0.08);
  }
  .header-inner { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 0; }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-img {
    width: 2.6rem; height: 2.6rem; border-radius: 0.9rem; overflow: hidden;
    box-shadow: 0 8px 20px hsl(var(--primary) / 0.45), 0 0 0 1px hsl(var(--primary) / 0.4);
    border: 2px solid hsl(var(--primary) / 0.55);
  }
  .brand-img img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-weight: 800; font-size: 1.05rem; line-height: 1; }
  .brand-sub { font-size: 0.7rem; margin-top: 0.25rem; color: hsl(var(--primary)); font-family: 'JetBrains Mono', monospace; }

  .hero { text-align: center; padding: 4rem 0 5rem; }
  .badge {
    display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem;
    padding: 0.45rem 1rem; border-radius: 9999px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    background: hsl(var(--primary) / 0.12);
    border: 1px solid hsl(var(--primary) / 0.4);
    color: hsl(var(--primary));
    box-shadow: 0 0 20px hsl(var(--primary) / 0.2);
  }
  .badge .dot { width: 0.55rem; height: 0.55rem; border-radius: 9999px; background: hsl(var(--primary)); box-shadow: 0 0 12px hsl(var(--primary)); animation: pulse-dot 1.6s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:0.5; transform:scale(0.7);} }

  .avatar-wrap { width: 9rem; height: 9rem; margin: 0 auto 1.5rem; position: relative; }
  .avatar-glow { position: absolute; inset: -10px; border-radius: 9999px; background: var(--gradient-vibrant); filter: blur(32px); opacity: 0.65; animation: glow-pulse 3.2s ease-in-out infinite; }
  @keyframes glow-pulse { 0%,100% { opacity:0.5; } 50% { opacity:0.85; } }
  .avatar-ring { position: absolute; inset: 0; border-radius: 9999px; border: 2px dashed hsl(var(--primary) / 0.55); animation: spin-slow 22s linear infinite; }
  .avatar-ring-2 { position: absolute; inset: -8px; border-radius: 9999px; border: 1px solid hsl(var(--primary-glow) / 0.4); animation: spin-slow 30s linear infinite reverse; }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .avatar-img {
    position: absolute; inset: 0.55rem; width: calc(100% - 1.1rem); height: calc(100% - 1.1rem);
    border-radius: 9999px; object-fit: cover;
    border: 4px solid hsl(var(--background));
    box-shadow: 0 8px 24px hsl(0 0% 0% / 0.35), 0 0 24px hsl(var(--primary) / 0.3);
  }
  .hero h1 { font-size: clamp(2.5rem, 6vw, 4.8rem); font-weight: 900; margin-bottom: 0.6rem; }
  .hero-role {
    font-size: clamp(1rem, 2vw, 1.2rem); margin-bottom: 1.75rem;
    color: hsl(var(--muted-foreground)); max-width: 38rem; margin-inline: auto;
    font-family: 'JetBrains Mono', monospace;
  }
  .hero-role .typed-cursor { display: inline-block; width: 2px; height: 1em; vertical-align: -2px; background: hsl(var(--primary)); margin-inline-start: 2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
  .socials { display: flex; justify-content: center; gap: 0.6rem; margin-top: 1.75rem; }

  section { margin-bottom: 5rem; }
  .section-title {
    font-size: clamp(1.6rem, 3vw, 2.25rem);
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .section-title.center { justify-content: center; text-align: center; }
  .section-title i { filter: drop-shadow(0 0 10px hsl(var(--primary) / 0.6)); }
  .section-sub { color: hsl(var(--muted-foreground)); margin-bottom: 2rem; }

  .grid { display: grid; gap: 1rem; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-projects { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

  .stat { padding: 1.4rem 1.25rem; text-align: center; }
  .stat .num { font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 900; }
  .stat .lbl { font-size: 0.75rem; margin-top: 0.4rem; color: hsl(var(--muted-foreground)); }

  .skill { padding: 1.6rem; text-align: center; }
  .skill-icon {
    width: 3.6rem; height: 3.6rem; margin: 0 auto 1rem;
    border-radius: 1rem; display: flex; align-items: center; justify-content: center;
    background: var(--gradient-vibrant); color: hsl(var(--background));
    box-shadow: 0 10px 24px hsl(var(--primary) / 0.45), 0 0 24px hsl(var(--primary) / 0.25);
    animation: float-y 4s ease-in-out infinite;
  }
  @keyframes float-y { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .skill-name { font-weight: 700; }

  .stack-card { padding: 1.4rem; }
  .stack-card .head { font-weight: 700; color: hsl(var(--primary)); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .project { padding: 1.4rem; display: block; }
  .project-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .project-icon { padding: 0.7rem; border-radius: 0.9rem; background: hsl(var(--primary) / 0.14); color: hsl(var(--primary)); display: inline-flex; box-shadow: inset 0 0 12px hsl(var(--primary) / 0.15); }
  .project h3 { font-size: 1.1rem; margin-bottom: 0.4rem; }
  .project p { font-size: 0.9rem; color: hsl(var(--muted-foreground)); }

  .app { padding: 1.6rem; }
  .app-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  .app-icon { width: 3.4rem; height: 3.4rem; border-radius: 0.9rem; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; box-shadow: 0 8px 20px hsl(var(--primary) / 0.3); }
  .app-meta .t { font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; color: hsl(var(--primary)); }
  .app p { font-size: 0.9rem; color: hsl(var(--muted-foreground)); margin-bottom: 1.25rem; }

  .cta-block { padding: 2.5rem 1.5rem; text-align: center; border-radius: 2rem; }
  .cta-block h2 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 0.6rem; }
  .cta-block p { color: hsl(var(--muted-foreground)); max-width: 30rem; margin: 0 auto 1.5rem; }
  .discord-block { background: linear-gradient(135deg, hsl(158 50% 12% / 0.7), hsl(150 40% 8% / 0.7)); }
  .discord-icon { width: 3.6rem; height: 3.6rem; margin: 0 auto 1rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #5865f2, #7289da); color: white; box-shadow: 0 8px 24px hsl(235 86% 65% / 0.4); }
  .btn-discord { background: linear-gradient(135deg, #5865f2, #7289da); color: white; }

  .email-line { margin-top: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: hsl(var(--primary)); }
  footer { text-align: center; font-size: 0.85rem; color: hsl(var(--muted-foreground)); padding: 2rem 0; border-top: 1px solid hsl(var(--border)); font-family: 'JetBrains Mono', monospace; }

  #topBtn {
    position: fixed; bottom: 1.5rem;
    width: 3rem; height: 3rem; border-radius: 9999px;
    background: var(--gradient-vibrant); color: hsl(var(--background));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px hsl(var(--primary) / 0.5), 0 0 20px hsl(var(--primary) / 0.3);
    opacity: 0; pointer-events: none; transform: scale(0.6);
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 60;
  }
  #topBtn.show { opacity: 1; pointer-events: auto; transform: scale(1); }

  .progress-bar {
    position: fixed; top: 0; inset-inline-start: 0; height: 2px;
    background: var(--gradient-vibrant);
    z-index: 70; width: 0%;
    box-shadow: 0 0 12px hsl(var(--primary));
  }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
    .grid-2 { grid-template-columns: 1fr; }
    .stat { padding: 0.9rem; }
    .stat .num { font-size: 1.4rem; }
    section { margin-bottom: 3.5rem; }

  /* ===== Matrix Code Rain ===== */
  (function matrixRain(){
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const chars = "01アァカサタナハマヤラワabcdef{}<>[]/=*+-_;:".split("");
    let cols, drops, fontSize;
    function resize(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fontSize = window.innerWidth < 768 ? 14 : 16;
      cols = Math.floor(canvas.width / fontSize);
      drops = new Array(cols).fill(0).map(()=>Math.random()*-50);
    }
    resize();
    window.addEventListener("resize", resize);

    let last = 0;
    const interval = 55; // ms between frames
    function draw(now){
      if (now - last >= interval){
        last = now;
        // fade trail
        ctx.fillStyle = "rgba(2, 12, 8, 0.12)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px JetBrains Mono, monospace";
        for (let i = 0; i < cols; i++){
          const ch = chars[Math.floor(Math.random()*chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          // head bright
          ctx.fillStyle = "rgba(180, 255, 220, 0.95)";
          ctx.fillText(ch, x, y);
          // body trail (green neon)
          ctx.fillStyle = "rgba(34, 230, 130, 0.85)";
          ctx.fillText(ch, x, y - fontSize);
          if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

  function startTyping(){
    clearTimeout(typeTimer);
    const phrases = T[lang].typedAr;
    const el = document.getElementById("typed");
    let pi = 0, ci = 0, deleting = false;
    function tick(){
      const cur = phrases[pi];
      if (!deleting){
        el.textContent = cur.slice(0, ++ci);
        if (ci === cur.length){ deleting = true; typeTimer = setTimeout(tick, 1600); return; }
      } else {
        el.textContent = cur.slice(0, --ci);
        if (ci === 0){ deleting = false; pi = (pi+1) % phrases.length; }
      }
      typeTimer = setTimeout(tick, deleting ? 35 : 70);
    }
    tick();
  }

  function applyLang(){
    const tr = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      if (tr[k] != null) el.textContent = tr[k];

    if (window.lucide) lucide.createIcons();
    runCounters();
    startTyping();

  function runCounters(){
    document.querySelectorAll("[data-counter]").forEach(el=>{
      const end = parseInt(el.dataset.counter,10);
      const suffix = el.dataset.suffix || "";
      const start = performance.now();
      const tick = (now)=>{
        const p = Math.min(1,(now-start)/1400);
        const v = Math.round(end*(1-Math.pow(1-p,3)));
        el.textContent = v+suffix;
        if (p<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  function init(){
    buildFloatingIcons();
    buildCodeSnippets();
    if (window.lucide) lucide.createIcons();
    applyLang();

    document.getElementById("langBtn").addEventListener("click",()=>{
      lang = lang === "ar" ? "en" : "ar"; applyLang();
    });

    let isLight = false;
    document.getElementById("themeBtn").addEventListener("click",()=>{
      document.documentElement.classList.toggle("light");
      isLight = !isLight;
      const icon = document.getElementById("themeIcon");
      icon.setAttribute("data-lucide", isLight ? "sun" : "moon");
      if (window.lucide) lucide.createIcons();
    });

    document.getElementById("copyBtn").addEventListener("click", async ()=>{
      try { await navigator.clipboard.writeText(EMAIL); } catch(e){}
      const label = document.getElementById("copyLabel");
      label.textContent = T[lang].copied;
      document.getElementById("copyIcon").setAttribute("data-lucide","check");
      if (window.lucide) lucide.createIcons();
      setTimeout(()=>{
        label.textContent = T[lang].copyMail;
        document.getElementById("copyIcon").setAttribute("data-lucide","clipboard");
        if (window.lucide) lucide.createIcons();
      },1500);
    });

    const topBtn = document.getElementById("topBtn");
    topBtn.style[document.documentElement.dir === "rtl" ? "left" : "right"] = "1.5rem";
    topBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

    const reveals = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if (e.isIntersecting){ e.target.classList.add("is-visible"); io.unobserve(e.target);} });
    },{threshold:0.12});
    reveals.forEach(r=>io.observe(r));

    let ticking = false;
    window.addEventListener("scroll",()=>{
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(()=>{
        const h = document.documentElement;
        const p = (h.scrollTop)/(h.scrollHeight - h.clientHeight) * 100;
        document.getElementById("progress").style.width = p + "%";
        topBtn.classList.toggle("show", window.scrollY > 600);
        ticking = false;
      });
    },{passive:true});
  }

  if (document.readyState !== "loading" && window.lucide) init();
  else window.addEventListener("load", init);
</script>
