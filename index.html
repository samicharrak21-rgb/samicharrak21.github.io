<style>
  :root {
    --bg: #0a0a0a;
    --ink: #f5f1e8;
    --ink-dim: #8a857a;
    --paper: #f5f1e8;
    --paper-2: #ebe5d6;
    --line: #1f1f1f;
    --accent: #2dd4a8;
    --accent-2: #facc15;
    --accent-3: #84cc16;
    --card: #131312;
  }
  .light {
    --bg: #f5f1e8;
    --ink: #0a0a0a;
    --ink-dim: #555;
    --line: #d8d2c2;
    --card: #ebe5d6;
    --accent: #0f9b76;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 90px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', 'Space Grotesk', system-ui, sans-serif;
    font-weight: 400;
    line-height: 1.55;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    cursor: default;
  }
  html[dir="ltr"] body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  ::selection { background: var(--accent); color: #000; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  img { max-width: 100%; display: block; }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ============ STRIPED + GRID BACKGROUND ============ */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, transparent, rgba(0,0,0,0.35));
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(ellipse 60% 50% at 80% 0%, hsla(165, 65%, 50%, 0.18), transparent 60%),
      radial-gradient(ellipse 50% 40% at 0% 100%, hsla(45, 95%, 55%, 0.10), transparent 60%);
    background-size: 56px 56px, 56px 56px, 100% 100%, 100% 100%;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 90%);
  }
  .light body::before {
    background-image:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, transparent, rgba(0,0,0,0.04));
  }
  .light body::after {
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px),
      radial-gradient(ellipse 60% 50% at 80% 0%, hsla(165, 65%, 40%, 0.12), transparent 60%),
      radial-gradient(ellipse 50% 40% at 0% 100%, hsla(35, 80%, 50%, 0.10), transparent 60%);
    background-size: 56px 56px, 56px 56px, 100% 100%, 100% 100%;
  }
  header, main, footer, .ticker-wrap { position: relative; z-index: 2; }

  /* ============ MARQUEE TICKER ============ */
  .ticker-wrap {
    position: sticky; top: 0; z-index: 60;
    background: var(--accent); color: #000;
    border-bottom: 1px solid #000;
    overflow: hidden;
    height: 36px; display: flex; align-items: center;
  }
  .ticker {
    display: flex; gap: 3rem; white-space: nowrap;
    animation: ticker 38s linear infinite;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding-inline-start: 3rem;
  }
  .ticker span { display: inline-flex; align-items: center; gap: 0.6rem; }
  .ticker .star { color: #000; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  html[dir="rtl"] .ticker { animation-direction: reverse; }

  /* ============ HEADER ============ */
  header {
    position: sticky; top: 36px; z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 1rem 2rem;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 2rem;
  }
  .brand {
    display: flex; align-items: center; gap: 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 0.85rem;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    font-family: 'Instrument Serif', serif;
    font-weight: 400; font-size: 1.35rem; font-style: italic;
    color: var(--bg);
    background:
      repeating-linear-gradient(45deg, var(--accent) 0 4px, color-mix(in srgb, var(--accent) 70%, #000) 4px 8px);
    border-radius: 12px;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 0 0 1.5px rgba(0,0,0,0.25);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
    position: relative;
    overflow: hidden;
  }
  .brand-mark::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 50%);
  }
  .brand-mark span { position: relative; z-index: 1; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .brand-mark::after {
    content: ""; position: absolute; bottom: -2px; right: -2px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-2, var(--accent)); box-shadow: 0 0 8px var(--accent-2, var(--accent));
  }
  .brand:hover .brand-mark { transform: rotate(-6deg) scale(1.08); }
  .brand-name { line-height: 1.1; }
  .brand-name small { display: block; font-size: 0.65rem; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }

  .nav { display: flex; justify-content: center; gap: 0.25rem; }
  .nav-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 600;
    padding: 0.5rem 0.85rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    position: relative;
    transition: color 0.2s;
  }
  .nav-link::before {
    content: "·"; margin-inline-end: 0.4rem; color: var(--accent); opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-link:hover, .nav-link.active { color: var(--ink); }
  .nav-link:hover::before, .nav-link.active::before { opacity: 1; }

  .header-actions { display: flex; align-items: center; gap: 0.5rem; }
  .icon-btn {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    transition: all 0.2s;
    background: transparent;
  }
  .icon-btn:hover { background: var(--accent); color: #000; border-color: #000; transform: translateY(-2px); }
  .menu-toggle { display: none; }

  @media (max-width: 900px) {
    .header-inner { grid-template-columns: 1fr auto; padding: 0.7rem 1rem; gap: 0.5rem; }
    .brand-name { font-size: 0.78rem; }
    .brand-name small { font-size: 0.6rem; }
    .nav {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      flex-direction: column; gap: 0;
      background: var(--bg); border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 0.5rem 1rem;
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
    }
    .nav.open { display: flex; }
    .nav-link { padding: 0.95rem 0.5rem; font-size: 0.95rem; border-bottom: 1px solid var(--line); }
    .nav-link:last-child { border-bottom: none; }
    .menu-toggle { display: grid; }
    .icon-btn { width: 36px; height: 36px; }
    header { position: relative; }
  }

  /* ============ MAIN GRID ============ */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 2; }
  @media (max-width: 768px) { .wrap { padding: 0 1.25rem; } }

  /* ============ HERO ============ */
  .hero { padding: 4rem 0 5rem; border-bottom: 1px solid var(--line); position: relative; }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 3rem;
    align-items: end;
  }
  .hero-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 1.5rem;
    display: flex; gap: 2rem; flex-wrap: wrap;
  }
  .hero-meta span { display: flex; align-items: center; gap: 0.4rem; }
  .hero-meta .live::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-3); box-shadow: 0 0 12px var(--accent-3);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hero h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: clamp(3rem, 11vw, 9rem);
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.045em;
    margin-bottom: 1.5rem;
  }
  html[dir="rtl"] .hero h1 { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 900; line-height: 1; }
  .hero h1 .ser { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent); }
  .hero-sub {
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    max-width: 520px; color: var(--ink-dim);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .hero-sub b { color: var(--ink); font-weight: 600; }

  .hero-portrait {
    width: 280px; height: 320px;
    position: relative;
    transition: transform 0.4s;
    isolation: isolate;
  }
  .hero-portrait::before {
    content: ""; position: absolute; inset: -18px -18px 18px 18px;
    background-image:
      repeating-linear-gradient(45deg, var(--accent) 0 6px, transparent 6px 12px);
    border-radius: 28px;
    z-index: -1;
    opacity: 0.55;
  }
  .hero-portrait::after {
    content: ""; position: absolute; inset: -8px;
    border: 1.5px solid var(--ink);
    border-radius: 28px;
    z-index: -1;
  }
  .hero-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 24px;
    border: 3px solid var(--bg);
    box-shadow: 0 18px 40px -10px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    filter: contrast(1.05) saturate(1.05);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .hero-portrait:hover img { transform: translate(-6px, -6px); }
  .hero-portrait:hover::after { transform: translate(6px, 6px); transition: transform 0.5s cubic-bezier(.2,.8,.2,1); }

  .hero-cta { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.85rem 1.4rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-radius: 999px;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--ink); color: var(--bg); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--ink); background: var(--card); transform: translateY(-2px); }
  .btn .arrow { transition: transform 0.2s; }
  .btn:hover .arrow { transform: translateX(4px); }
  html[dir="rtl"] .btn:hover .arrow { transform: translateX(-4px) scaleX(-1); }
  html[dir="rtl"] .btn .arrow { transform: scaleX(-1); }

  @media (max-width: 768px) {
    .hero { padding: 2rem 0 2.5rem; }
    .hero-grid { grid-template-columns: 1fr; gap: 1.5rem; justify-items: center; text-align: center; }
    html[dir="rtl"] .hero-grid { text-align: right; }
    .hero-portrait { width: 220px; height: 260px; align-self: center; order: -1; padding: 0; }
    .hero-portrait::before { inset: -12px -12px 12px 12px; }
    .hero-meta { font-size: 0.62rem; gap: 0.85rem; margin-bottom: 1rem; justify-content: center; }
    .hero h1 { font-size: clamp(2.4rem, 13vw, 4.2rem); margin-bottom: 0.85rem; line-height: 0.95; }
    .hero-sub { font-size: 0.92rem; margin-bottom: 1.25rem; margin-inline: auto; }
    html[dir="rtl"] .hero-sub { text-align: right; }
    .hero-cta { justify-content: center; width: 100%; }
    .btn { padding: 0.8rem 1.15rem; font-size: 0.72rem; flex: 1; justify-content: center; min-width: 140px; max-width: 200px; }
  }

  /* ============ SECTION HEADERS ============ */
  section.block { padding: 5rem 0; border-bottom: 1px solid var(--line); position: relative; }
  .block-head {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 2rem; align-items: end;
    margin-bottom: 3rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
  }
  .block-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; color: var(--accent);
    font-weight: 700;
  }
  .block-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  html[dir="rtl"] .block-title { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 900; }
  .block-title em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent); }
  .block-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.08em;
    text-align: end;
  }
  @media (max-width: 768px) {
    section.block { padding: 3rem 0; }
    .block-head { grid-template-columns: 1fr; gap: 0.5rem; margin-bottom: 2rem; }
    .block-meta { text-align: start; }
  }

  /* ============ STATS BAR ============ */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .stat-cell {
    padding: 1.75rem 1.5rem;
    border-inline-end: 1px solid var(--line);
    position: relative;
  }
  .stat-cell:last-child { border-inline-end: none; }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.6rem; font-weight: 700;
    line-height: 1; letter-spacing: -0.03em;
    margin-bottom: 0.4rem;
  }
  .stat-num em { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--accent); }
  .stat-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .stat-cell { padding: 1.25rem 1rem; }
    .stat-cell:nth-child(2) { border-inline-end: none; }
    .stat-cell:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .stat-num { font-size: 1.9rem; }
  }

  /* ============ SKILLS ============ */
  .skills-list {
    display: flex; flex-direction: column;
    border-top: 1px solid var(--line);
  }
  .skill-row {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 2rem; align-items: center;
    padding: 1.75rem 0.5rem;
    border-bottom: 1px solid var(--line);
    transition: background 0.2s, padding 0.3s;
    cursor: pointer;
  }
  .skill-row:hover { background: var(--card); padding-inline-start: 1.5rem; }
  .skill-row .num { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--ink-dim); width: 30px; }
  .skill-row .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600; letter-spacing: -0.02em;
  }
  html[dir="rtl"] .skill-row .name { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; }
  .skill-row .name em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent); margin-inline-start: 0.5rem; font-size: 0.7em; }
  .skill-row .arrow-cell { color: var(--ink-dim); transition: color 0.2s, transform 0.2s; }
  .skill-row:hover .arrow-cell { color: var(--accent); transform: rotate(-45deg); }
  html[dir="rtl"] .skill-row:hover .arrow-cell { transform: rotate(45deg) scaleX(-1); }
  html[dir="rtl"] .skill-row .arrow-cell { transform: scaleX(-1); }
  @media (max-width: 768px) {
    .skill-row { gap: 1rem; padding: 1.25rem 0.25rem; }
    .skill-row .num { width: auto; font-size: 0.7rem; }
    .skill-row:hover { padding-inline-start: 0.5rem; }
  }

  /* ============ STACK ============ */
  .stack-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
  .stack-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.75rem;
    background: var(--card);
    transition: transform 0.3s, border-color 0.3s;
  }
  .stack-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .stack-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem; border-bottom: 1px solid var(--line);
  }
  .stack-head h3 { font-size: 1.1rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: -0.01em; }
  .stack-head .count { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--ink-dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 500;
    padding: 0.35rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .chip:hover { background: var(--accent); color: #000; border-color: #000; transform: translateY(-2px); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  @media (max-width: 768px) {
    .stack-grid { grid-template-columns: 1fr; gap: 1rem; }
    .stack-card { padding: 1.25rem; }
  }

  /* ============ PROJECTS ============ */
  .filters {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
    margin-bottom: 2rem;
  }
  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem; font-weight: 600;
    padding: 0.5rem 0.95rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .filter-chip:hover { color: var(--ink); border-color: var(--ink); }
  .filter-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  @media (max-width: 768px) {

        {title:"Muslim · رفيق المسلم", desc:"تطبيق ويب إسلامي شامل لأوقات الصلاة والأذكار والقرآن."},
        {title:"NovaX · شبكة اجتماعية", desc:"منصة تواصل اجتماعي حديثة بواجهة سلسة ومتجاوبة."},
        {title:"Modern Artistry · ألعاب", desc:"موقع ألعاب تفاعلي بتصميم فني حديث داخل المتصفح."},
      ],
      appsTitle:`تطبيقات <em>الجوال</em>`,
      apps:[
        {title:"تطبيق الأندلس", desc:"تطبيقي الرئيسي بتجربة سلسة وواجهة عربية أنيقة."},
        {title:"تطبيق الديوان", desc:"موسوعة الموشحات والتراث الأندلسي على هاتفك."},
      ],
      download:"تحميل APK",
      tlTitle:`المسيرة <em>الزمنية</em>`,
      timeline:[
        {year:"2024", title:"بداية الرحلة", desc:"تعلّم HTML/CSS/JS وبناء أول صفحات تجريبية، واستكشاف عالم الويب الحديث."},
        {year:"2025 · Q1", title:"تطوير البوتات", desc:"إطلاق بوتات Discord و Telegram، وتقديم خدمات أتمتة لمجتمعات عربية."},
        {year:"2025 · Q3", title:"تطبيقات الأندلس", desc:"نشر تطبيقات أندرويد عربية بواجهات أنيقة وتركيز على التراث."},
        {year:"2026", title:"الذكاء الاصطناعي", desc:"دمج نماذج الذكاء الاصطناعي داخل المنتجات، وبناء واجهات تتفاعل بذكاء."},
      ],
      discordTitle:"مجتمعنا وحلول الأتمتة",
      discordDesc:"انضم لسيرفر الديسكورد للحصول على بوتات مخصصة وحلول أتمتة احترافية.",
      discordBtn:"الدخول",
      contactEyebrow:"// تواصل",
      contactTitle:`لنبني <em>شيئًا</em><br/>رائعًا معًا`,
      sendMail:"راسلني", copyMail:"نسخ البريد", copied:"تم النسخ",
      footer:"© 2026 SAMI CHARRAK · ALL RIGHTS RESERVED",
    },
    en: {
      navAbout:"About", navSkills:"Skills", navProjects:"Work", navJourney:"Journey", navContact:"Contact",
      available:"Available for work", loc:"Tunisia · Remote",
      heroName:`Sami <span class="ser">Charrak</span>`,
      heroSub:`<b>Frontend engineer</b> & bot developer. I craft fast, elegant, and meaningful digital experiences — from modern React interfaces to smart automation on Discord & Telegram.`,
      seeWork:"View work", contact:"Get in touch",
      statsTitle:["Projects","Years","Tech","Coffee"],
      skillsTitle:`What I <em>make</em>`, skillsMeta:"Core capabilities",
      skills:[
        {name:"Frontend interface design", em:"Frontend"},
        {name:"Smart bot development", em:"Bots"},
        {name:"AI integration", em:"AI"},
        {name:"UX design & systems", em:"UX"},
      ],
      stackTitle:`Stack & <em>tools</em>`, stackMeta:"Daily platforms",
      langsCard:"Languages", toolsCard:"Tools & platforms",
      projectsTitle:`Selected <em>work</em>`, projectsMeta:"6 projects · 2024–2026",
      filterAll:"All",
      projects:[
        {title:"Cinema Platform", desc:"A modern interface for browsing entertainment content with smooth, high-performance UX."},
        {title:"Smart Links Hub", desc:"A professional landing page to manage personal links and social profiles."},
        {title:"Andalusia Diwan", desc:"An interactive digital encyclopedia preserving Andalusian heritage."},
        {title:"Muslim · Companion", desc:"A complete Islamic web app for prayer times, Adhkar, and Quran."},
        {title:"NovaX · Social Network", desc:"A modern social platform with a smooth UI for sharing posts."},
        {title:"Modern Artistry · Games", desc:"An interactive games site with modern artistic design."},
      ],
      appsTitle:`Mobile <em>apps</em>`,
      apps:[
        {title:"Andalus App", desc:"My flagship app with smooth UX and an elegant Arabic interface."},
        {title:"Diwan App", desc:"An encyclopedia of Muwashshahat and Andalusian heritage on your phone."},
      ],
      download:"Download APK",
      tlTitle:`The <em>journey</em>`,
      timeline:[
        {year:"2024", title:"The Beginning", desc:"Learning HTML/CSS/JS and shipping first experimental pages while exploring modern web development."},
        {year:"2025 · Q1", title:"Bot Development", desc:"Launching Discord & Telegram bots and offering automation services to Arabic communities."},
        {year:"2025 · Q3", title:"Andalus Apps", desc:"Publishing Arabic Android apps with elegant interfaces and a focus on heritage."},
        {year:"2026", title:"AI Integration", desc:"Embedding AI models into products and building interfaces that interact intelligently."},
      ],
      discordTitle:"Community & automation",
      discordDesc:"Join the Discord server for custom bots and professional automation solutions.",
      discordBtn:"Join",
      contactEyebrow:"// CONTACT",
      contactTitle:`Let's build <em>something</em><br/>great together`,
      sendMail:"Send mail", copyMail:"Copy email", copied:"Copied",
      footer:"© 2026 SAMI CHARRAK · ALL RIGHTS RESERVED",
    },
  };

  /* ========== STATE ========== */
  let lang = localStorage.getItem("lang") || "ar";
  let isLight = localStorage.getItem("theme") === "light";
  if (isLight) document.documentElement.classList.add("light");
  let activeFilter = "all";
  const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ========== TICKER ========== */
  function buildTicker(){
    const items = lang === "ar"
      ? ["متاح للعمل ✦","مهندس واجهات ✦","مطور بوتات ✦","تونس → العالم ✦","مشاريع 2026 ✦","Frontend · Bots · AI ✦"]
      : ["AVAILABLE FOR WORK ✦","FRONTEND ENGINEER ✦","BOT DEVELOPER ✦","TUNISIA → WORLDWIDE ✦","2026 PROJECTS ✦","FRONTEND · BOTS · AI ✦"];
    const set = items.map(t => `<span>${t}</span>`).join("");
    document.getElementById("ticker").innerHTML = set + set + set;
  }

  /* ========== RENDER ========== */
  function renderProjects(){
    const tr = T[lang];
    const grid = document.getElementById("projectGrid");
    grid.innerHTML = tr.projects.map((p,i)=>{
      const tags = projectTags[i] || [];
      const visible = activeFilter === "all" || tags.includes(activeFilter);
      const num = String(i+1).padStart(2, "0");
      return `
      <a href="${projectUrls[i]}" target="_blank" rel="noreferrer" class="project ${visible?'':'hidden'}" data-tags="${tags.join(',')}">
        <div class="project-cover">
          <div class="project-cover-bg"></div>
          <span class="project-num">PROJ/${num}</span>
          <span class="project-arrow"><i data-lucide="arrow-up-right" style="width:14px;height:14px;"></i></span>
          <div class="project-cover-icon"><i data-lucide="${projectIcons[i]}" style="width:28px;height:28px;"></i></div>
        </div>
        <div class="project-body">
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.desc)}</p>
          <div class="project-tags">${tags.map(t=>`<span class="project-tag">${esc(t)}</span>`).join('')}</div>
        </div>
      </a>`;
    }).join("");
    if (window.lucide) lucide.createIcons();
  }

  function renderFilters(){
    const tr = T[lang];
    const all = new Set();
    projectTags.forEach(arr => arr.forEach(t => all.add(t)));
    const tags = ["all", ...Array.from(all)];
    document.getElementById("filters").innerHTML = tags.map(t=>{
      const label = t === "all" ? tr.filterAll : t;
      return `<button class="filter-chip ${activeFilter===t?'active':''}" data-tag="${t}">${esc(label)}</button>`;
    }).join("");
    document.querySelectorAll(".filter-chip").forEach(b=>{
      b.addEventListener("click", ()=>{
        activeFilter = b.dataset.tag;
        renderFilters();
        renderProjects();
      });
    });
  }

  function applyLang(){
    const tr = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = lang === "ar" ? "سامي شراك · Portfolio 2026" : "Sami Charrak · Portfolio 2026";
    document.getElementById("langLabel").textContent = lang === "ar" ? "EN" : "ع";
    localStorage.setItem("lang", lang);

    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const k = el.getAttribute("data-i18n");
      if (tr[k] != null) el.textContent = tr[k];
    });

    document.getElementById("heroName").innerHTML = tr.heroName;
    document.getElementById("heroSub").innerHTML = tr.heroSub;
    document.getElementById("skillsTitle").innerHTML = tr.skillsTitle;
    document.getElementById("stackTitle").innerHTML = tr.stackTitle;
    document.getElementById("projectsTitle").innerHTML = tr.projectsTitle;
    document.getElementById("appsTitle").innerHTML = tr.appsTitle;
    document.getElementById("tlTitle").innerHTML = tr.tlTitle;
    document.getElementById("contactTitle").innerHTML = tr.contactTitle;

    // Stats
    document.getElementById("stats").innerHTML = statValues.map((v,i)=>`
      <div class="stat-cell">
        <div class="stat-num"><span data-counter="${v.end}" data-suffix="${v.suffix}">0${v.suffix}</span></div>
        <div class="stat-lbl">${esc(tr.statsTitle[i])}</div>
      </div>`).join("");

    // Skills
    document.getElementById("skillsList").innerHTML = tr.skills.map((s,i)=>`
      <div class="skill-row">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="name">${esc(s.name)} <em>${esc(s.em)}</em></div>
        <div class="arrow-cell"><i data-lucide="arrow-right" style="width:24px;height:24px;"></i></div>
      </div>`).join("");

    // Stack
    document.getElementById("langs").innerHTML = langs.map(n=>`<span class="chip"><span class="dot"></span>${esc(n)}</span>`).join("");
    document.getElementById("tools").innerHTML = tools.map(n=>`<span class="chip"><span class="dot"></span>${esc(n)}</span>`).join("");
    document.getElementById("langsCount").textContent = `(${langs.length})`;
    document.getElementById("toolsCount").textContent = `(${tools.length})`;

    renderFilters();
    renderProjects();

    // Apps
    document.getElementById("appsGrid").innerHTML = tr.apps.map((a,i)=>`
      <div class="app">
        <div class="app-icon"><i data-lucide="smartphone" style="width:28px;height:28px;"></i></div>
        <div class="app-body">
          <h3>${esc(a.title)}</h3>
          <div class="platform">ANDROID · APK</div>
          <p>${esc(a.desc)}</p>
          <a href="${appUrls[i]}" target="_blank" rel="noreferrer">
            <i data-lucide="download" style="width:14px;height:14px;"></i>
            ${esc(tr.download)}
          </a>
        </div>
      </div>`).join("");

    // Timeline
    document.getElementById("timelineList").innerHTML = tr.timeline.map(t=>`
      <div class="tl-row">
        <div class="tl-year">${esc(t.year)}</div>
        <div class="tl-marker"></div>
        <div class="tl-content">
          <h3>${esc(t.title)}</h3>
          <p>${esc(t.desc)}</p>
        </div>
      </div>`).join("");

    // Footer socials
    document.getElementById("footerSocials").innerHTML = socials.map(s=>`
      <a href="${s.href}" target="_blank" rel="noreferrer" class="icon-btn" aria-label="${s.label}" style="width:32px;height:32px;border-radius:6px;">
        <i data-lucide="${s.icon}" style="width:14px;height:14px;"></i>
      </a>`).join("");

    document.getElementById("brandSub").textContent = lang === "ar" ? "بورتفوليو · 2026" : "PORTFOLIO · 2026";

    buildTicker();
    if (window.lucide) lucide.createIcons();
    runCounters();
  }

  /* ========== COUNTERS ========== */
  function runCounters(){
    document.querySelectorAll("[data-counter]").forEach(el=>{
      const end = parseInt(el.dataset.counter,10);
      const suffix = el.dataset.suffix || "";
      const start = performance.now();
      const tick = (now)=>{
        const p = Math.min(1,(now-start)/1400);
        const v = Math.round(end*(1-Math.pow(1-p,3)));
        el.textContent = v+suffix;
        if (p<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  /* ========== INTERACTIONS ========== */
  document.getElementById("langBtn").addEventListener("click", ()=>{
    lang = lang === "ar" ? "en" : "ar";
    applyLang();
  });

  function setTheme(light){
    isLight = light;
    document.documentElement.classList.toggle("light", isLight);
    localStorage.setItem("theme", isLight ? "light" : "dark");
    const icon = document.getElementById("themeIcon");
    icon.setAttribute("data-lucide", isLight ? "sun" : "moon");
    if (window.lucide) lucide.createIcons();
    if (typeof applyAccent === "function") applyAccent();
  }
  document.getElementById("themeBtn").addEventListener("click", ()=>setTheme(!isLight));

  /* Accent color toggle (mint <-> orange) */
  const ACCENTS = {
    mint:   { accent: "#2dd4a8", accentLight: "#0f9b76" },
    orange: { accent: "#ff5722", accentLight: "#c2410c" },
  };
  let accent = localStorage.getItem("accent") || "mint";
  function applyAccent(){
    const a = ACCENTS[accent];
    document.documentElement.style.setProperty("--accent", a.accent);
    if (document.documentElement.classList.contains("light")) {
      document.documentElement.style.setProperty("--accent", a.accentLight);
    }
    localStorage.setItem("accent", accent);
  }
  applyAccent();
  document.getElementById("accentBtn").addEventListener("click", ()=>{
    accent = accent === "mint" ? "orange" : "mint";
    applyAccent();
  });

  /* Menu */
  const nav = document.getElementById("nav");
  const menuToggle = document.getElementById("menuToggle");
  menuToggle.addEventListener("click", ()=>{
    const open = nav.classList.toggle("open");
    document.getElementById("menuIcon").setAttribute("data-lucide", open ? "x" : "menu");
    if (window.lucide) lucide.createIcons();
  });
  nav.addEventListener("click", e=>{
    if (e.target.classList.contains("nav-link")){
      nav.classList.remove("open");
      document.getElementById("menuIcon").setAttribute("data-lucide", "menu");
      if (window.lucide) lucide.createIcons();
    }
  });

  /* Copy */
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
  }
  document.getElementById("copyBtn").addEventListener("click", async ()=>{
    try { await navigator.clipboard.writeText(EMAIL); } catch(e){}
    showToast(T[lang].copied);
  });

  /* Top button + progress + active nav */
  const topBtn = document.getElementById("topBtn");
  const progress = document.getElementById("progress");
  topBtn.addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));

  const sections = ["about","skills","projects","timeline","contact"];
  function onScroll(){
    const y = window.scrollY;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = Math.min(100, (y/h)*100) + "%";
    topBtn.classList.toggle("show", y > 600);

    let current = "about";
    for (const id of sections){
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 140) current = id;
    }
    document.querySelectorAll(".nav-link").forEach(l=>{
      l.classList.toggle("active", l.getAttribute("href") === "#"+current);
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* Reveal */
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if (e.isIntersecting){ e.target.classList.add("is-visible"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -10% 0px", threshold: 0.05 });

  /* Init */
  function init(){
    applyLang();
    document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
    onScroll();
    if (window.lucide) lucide.createIcons();
  }
  if (document.readyState !== "loading") init();
  else document.addEventListener("DOMContentLoaded", init);
  window.addEventListener("load", ()=>{ if (window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
