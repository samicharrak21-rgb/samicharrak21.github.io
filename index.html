<style>
  :root {
    --background: 158 60% 4%;
    --foreground: 150 30% 96%;
    --card: 158 45% 8%;
    --primary: 150 95% 55%;
    --primary-foreground: 158 60% 4%;
    --primary-glow: 165 100% 50%;
    --primary-deep: 142 80% 35%;
    --secondary: 158 35% 12%;
    --muted-foreground: 150 18% 72%;
    --accent: 75 95% 55%;
    --accent-2: 175 90% 55%;
    --border: 150 30% 18%;
    --gradient-primary: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
    --gradient-vibrant: linear-gradient(135deg, hsl(var(--accent)) 0%, hsl(var(--primary)) 50%, hsl(var(--primary-glow)) 100%);
    --shadow-card: 0 10px 30px hsl(150 100% 30% / 0.15), 0 0 0 1px hsl(var(--primary) / 0.05);
    --shadow-elevated: 0 20px 50px -18px hsl(var(--primary) / 0.55), 0 0 30px hsl(var(--primary) / 0.15);
    --shadow-glow: 0 0 24px hsl(var(--primary) / 0.5);
  }
  .light {
    --background: 150 40% 97%;
    --foreground: 158 60% 8%;
    --card: 0 0% 100%;
    --primary: 150 80% 32%;
    --primary-foreground: 0 0% 100%;
    --primary-glow: 170 80% 35%;
    --primary-deep: 142 70% 25%;
    --secondary: 150 30% 92%;
    --muted-foreground: 158 18% 35%;
    --accent: 80 70% 38%;
    --accent-2: 175 70% 35%;
    --border: 150 25% 85%;
    --shadow-card: 0 10px 30px hsl(150 40% 25% / 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
  body {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
    font-weight: 500;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }
  html[dir="ltr"] body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  html[dir="ltr"] h1, html[dir="ltr"] h2, html[dir="ltr"] h3, html[dir="ltr"] h4 { letter-spacing: -0.03em; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }
  ::selection { background: hsl(var(--primary) / 0.4); color: hsl(var(--background)); }
  :focus-visible { outline: 2px solid hsl(var(--primary)); outline-offset: 3px; border-radius: 6px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: hsl(var(--background)); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(hsl(var(--primary)), hsl(var(--primary-glow))); border-radius: 8px; border: 2px solid hsl(var(--background)); }

  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .text-primary { color: hsl(var(--primary)); }
  .text-muted { color: hsl(var(--muted-foreground)); }
  .gradient-bg { background: var(--gradient-primary); }
  .gradient-vibrant { background: var(--gradient-vibrant); }
  .gradient-text {
    background: var(--gradient-vibrant);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px hsl(var(--primary) / 0.35));
  }

  /* ============ ANIMATED BACKGROUND ============ */
  #matrix { position: fixed; inset: 0; z-index: -3; pointer-events: none; opacity: 0.45; mix-blend-mode: screen; }
  .light #matrix { opacity: 0.12; mix-blend-mode: multiply; }

  #particles { position: fixed; inset: 0; z-index: -3; pointer-events: none; }

  .bg-fx {
    position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, hsl(var(--primary) / 0.25), transparent 55%),
      radial-gradient(ellipse 65% 55% at 90% 80%, hsl(var(--accent) / 0.2), transparent 55%),
      radial-gradient(ellipse 60% 50% at 10% 60%, hsl(var(--primary-glow) / 0.2), transparent 55%),
      radial-gradient(ellipse 40% 35% at 50% 50%, hsl(var(--accent-2) / 0.1), transparent 60%);
    animation: bg-breathe 12s ease-in-out infinite;
  }
  @keyframes bg-breathe {
    0%,100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  .bg-fx::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(hsl(var(--primary) / 0.07) 1px, transparent 1px),
      linear-gradient(90deg, hsl(var(--primary) / 0.07) 1px, transparent 1px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 30%, black, transparent 80%);
    mask-image: radial-gradient(ellipse 95% 75% at 50% 30%, black, transparent 80%);
    opacity: 0.65;
    animation: grid-move 25s linear infinite;
  }
  .bg-fx::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle 600px at var(--mouse-x, 50%) var(--mouse-y, 50%), hsl(var(--primary) / 0.08), transparent 60%);
    transition: background 0.3s ease;
  }
  @keyframes grid-move { to { background-position: 52px 52px, 52px 52px; } }

  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(100px); opacity: 0.45; will-change: transform; mix-blend-mode: screen; }
  .light .blob { mix-blend-mode: multiply; opacity: 0.2; }
  .blob-1 { width: 520px; height: 520px; background: hsl(var(--primary) / 0.65); top: -180px; inset-inline-end: -140px; animation: blob-a 16s ease-in-out infinite; }
  .blob-2 { width: 450px; height: 450px; background: hsl(var(--accent) / 0.5); top: 32%; inset-inline-start: -180px; animation: blob-b 20s ease-in-out infinite; }
  .blob-3 { width: 400px; height: 400px; background: hsl(var(--primary-glow) / 0.5); bottom: -140px; inset-inline-end: 22%; animation: blob-c 18s ease-in-out infinite; }
  .blob-4 { width: 340px; height: 340px; background: hsl(var(--accent-2) / 0.4); top: 58%; inset-inline-end: 8%; animation: blob-d 24s ease-in-out infinite; }
  .blob-5 { width: 280px; height: 280px; background: hsl(var(--primary) / 0.3); bottom: 20%; inset-inline-start: 15%; animation: blob-a 28s ease-in-out infinite reverse; }
  @keyframes blob-a { 0%,100% { transform: translate(0,0) scale(1) rotate(0deg); } 33% { transform: translate(-50px,35px) scale(1.15) rotate(5deg); } 66% { transform: translate(20px,-20px) scale(0.95) rotate(-3deg); } }
  @keyframes blob-b { 0%,100% { transform: translate(0,0) scale(1) rotate(0deg); } 33% { transform: translate(55px,-35px) scale(1.18) rotate(-4deg); } 66% { transform: translate(-25px,25px) scale(0.92) rotate(6deg); } }
  @keyframes blob-c { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(35px,-45px) scale(1.12); } }
  @keyframes blob-d { 0%,100% { transform: translate(0,0) scale(1) rotate(0deg); } 40% { transform: translate(-30px,40px) scale(1.1) rotate(8deg); } 80% { transform: translate(40px,-15px) scale(0.9) rotate(-5deg); } }

  .code-snippets, .floating-icons { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .snippet {
    position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    color: hsl(var(--primary) / 0.55); background: hsl(var(--card) / 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid hsl(var(--primary) / 0.25); border-radius: 8px;
    padding: 0.4rem 0.7rem; white-space: pre;
    box-shadow: 0 8px 24px hsl(0 0% 0% / 0.3), inset 0 0 12px hsl(var(--primary) / 0.08);
    animation: snippet-float linear infinite; will-change: transform;
    text-shadow: 0 0 8px hsl(var(--primary) / 0.4);
  }
  @keyframes snippet-float {
    0% { transform: translateY(0) rotate(-2deg) scale(0.8); opacity: 0; }
    8% { opacity: 0.85; transform: translateY(-8vh) rotate(-1deg) scale(1); }
    85% { opacity: 0.7; }
    100% { transform: translateY(-115vh) rotate(4deg) scale(0.9); opacity: 0; }
  }

  .float-icon {
    position: absolute; width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: hsl(var(--card) / 0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid hsl(var(--primary) / 0.3);
    box-shadow: 0 8px 24px hsl(0 0% 0% / 0.3), 0 0 16px hsl(var(--primary) / 0.15);
    opacity: 0.8; animation: float-up linear infinite; will-change: transform;
  }
  .float-icon svg { width: 28px; height: 28px; }
  @keyframes float-up {
    0% { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0; }
    6% { opacity: 0.8; transform: translateY(-6vh) rotate(3deg) scale(1); }
    50% { transform: translateY(-55vh) rotate(10deg) scale(1.05); }
    88% { opacity: 0.6; }
    100% { transform: translateY(-112vh) rotate(22deg) scale(0.85); opacity: 0; }
  }

  .beam {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, hsl(var(--primary-glow) / 0.08) 45%, hsl(var(--primary) / 0.12) 50%, hsl(var(--primary-glow) / 0.08) 55%, transparent 65%);
    animation: beam-sweep 12s ease-in-out infinite alternate; mix-blend-mode: screen;
  }
  .beam-2 {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(245deg, transparent 40%, hsl(var(--accent) / 0.06) 48%, transparent 56%);
    animation: beam-sweep-2 18s ease-in-out infinite alternate; mix-blend-mode: screen;
  }
  @keyframes beam-sweep { 0% { transform: translateX(-40%) skewX(-5deg); } 100% { transform: translateX(40%) skewX(5deg); } }
  @keyframes beam-sweep-2 { 0% { transform: translateX(30%) skewX(3deg); } 100% { transform: translateX(-30%) skewX(-3deg); } }

  .scanlines {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, hsl(var(--primary) / 0.025) 3px, transparent 4px);
    mix-blend-mode: overlay;
  }
  .light .scanlines { display: none; }

  .glass {
    background: hsl(var(--card) / 0.6);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid hsl(var(--border));
    border-radius: 1.5rem;
    box-shadow: var(--shadow-card);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative; overflow: hidden;
  }
  .glass::before {
    content: ""; position: absolute; top: 0; inset-inline-start: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.6), transparent);
    opacity: 0.5;
  }
  @media (hover: hover) {
    .glass:hover { transform: translateY(-5px) scale(1.01); border-color: hsl(var(--primary) / 0.6); box-shadow: var(--shadow-elevated); }
  }

  /* Spotlight on cards */
  .spotlight { position: relative; }
  .spotlight::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), hsl(var(--primary) / 0.18), transparent 50%);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .spotlight:hover::after { opacity: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-weight: 700; padding: 0.8rem 1.6rem; border-radius: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    border: 1px solid transparent; position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: var(--gradient-vibrant); color: hsl(var(--background));
    box-shadow: 0 8px 24px hsl(var(--primary) / 0.35), 0 0 0 1px hsl(var(--primary) / 0.4);
  }
  .btn-primary:hover { box-shadow: 0 14px 36px hsl(var(--primary) / 0.55), 0 0 0 1px hsl(var(--primary) / 0.6); }
  .btn-secondary { background: hsl(var(--secondary)); border-color: hsl(var(--primary) / 0.25); color: hsl(var(--foreground)); }
  .btn-secondary:hover { border-color: hsl(var(--primary) / 0.6); background: hsl(var(--primary) / 0.08); }

  .icon-btn {
    width: 2.5rem; height: 2.5rem; border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: hsl(var(--secondary)); border: 1px solid hsl(var(--primary) / 0.25);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .icon-btn:hover { transform: translateY(-2px); border-color: hsl(var(--primary) / 0.7); background: hsl(var(--primary) / 0.12); box-shadow: 0 0 16px hsl(var(--primary) / 0.3); }

  .chip {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    padding: 0.4rem 0.8rem; border-radius: 0.6rem;
    background: hsl(var(--secondary)); border: 1px solid hsl(var(--primary) / 0.2);
    transition: border-color 0.2s ease, transform 0.2s ease;
    cursor: default;
  }
  .chip:hover { border-color: hsl(var(--primary) / 0.6); transform: translateY(-1px); }
  .chip .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }

  .container { max-width: 1180px; margin: 0 auto; padding: 0 1.25rem; position: relative; z-index: 1; }

  /* Header / Nav */
  header {
    position: sticky; top: 0; z-index: 50;
    background: hsl(var(--background) / 0.7);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid hsl(var(--primary) / 0.2);
    box-shadow: 0 1px 24px hsl(var(--primary) / 0.08);
  }
  .header-inner { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0; gap: 1rem; }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-img {
    width: 2.6rem; height: 2.6rem; border-radius: 0.9rem; overflow: hidden;
    box-shadow: 0 8px 20px hsl(var(--primary) / 0.45), 0 0 0 1px hsl(var(--primary) / 0.4);
    border: 2px solid hsl(var(--primary) / 0.55);
  }
  .brand-img img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-weight: 800; font-size: 1.05rem; line-height: 1; }
  .brand-sub { font-size: 0.7rem; margin-top: 0.25rem; color: hsl(var(--primary)); font-family: 'JetBrains Mono', monospace; }

  .nav { display: flex; align-items: center; gap: 0.25rem; }
  .nav-link {
    padding: 0.5rem 0.85rem; border-radius: 0.7rem;

    transition: color 0.2s ease, background 0.2s ease;
    position: relative;
  }
  .nav-link:hover { color: hsl(var(--foreground)); background: hsl(var(--primary) / 0.08); }

    content: ""; position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);

  }

  }

  /* ===== Floating Particles ===== */
  (function particles(){
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let w, h, dots = [];
    const count = window.innerWidth < 768 ? 18 : 50;
    function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    resize(); window.addEventListener("resize", resize);
    for (let i = 0; i < count; i++){
      dots.push({ x: Math.random()*w, y: Math.random()*h, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, r: Math.random()*2+0.5, o: Math.random()*0.5+0.2 });
    }
    function draw(){
      ctx.clearRect(0,0,w,h);
      dots.forEach(d => {
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
        if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(34, 230, 130, ${d.o})`;
        ctx.fill();
      });
      // connect nearby
      for (let i = 0; i < dots.length; i++){
        for (let j = i+1; j < dots.length; j++){
          const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 100){
            ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
            ctx.strokeStyle = `rgba(34, 230, 130, ${0.1 * (1 - dist/100)})`;
            ctx.lineWidth = 0.5; ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();

  /* ===== Matrix Code Rain ===== */
  (function matrixRain(){
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const chars = "01アァカサタナハマヤラワabcdef{}<>[]/=*+-_;:λΣΩπ∞".split("");
    let cols, drops, fontSize;
    function resize(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fontSize = window.innerWidth < 768 ? 13 : 15;
      cols = Math.floor(canvas.width / fontSize);
      drops = new Array(cols).fill(0).map(()=>Math.random()*-60);
    }
    resize();
    window.addEventListener("resize", resize);
    let last = 0;
    const interval = 50;
    function draw(now){
      if (now - last >= interval){
        last = now;
        ctx.fillStyle = "rgba(2, 16, 10, 0.13)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px JetBrains Mono, monospace";
        for (let i = 0; i < cols; i++){
          const ch = chars[Math.floor(Math.random()*chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          const brightness = Math.random();
          const isMobile = window.innerWidth < 768;
          if (brightness > 0.7 && !isMobile) {
            ctx.fillStyle = "rgba(200, 255, 230, 0.9)";
            ctx.shadowBlur = 6; ctx.shadowColor = "rgba(34, 230, 130, 0.4)";
          } else {
            ctx.fillStyle = "rgba(34, 230, 130, 0.75)";
            ctx.shadowBlur = 0;
          }
          ctx.fillText(ch, x, y);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(34, 230, 130, 0.4)";
          ctx.fillText(chars[Math.floor(Math.random()*chars.length)], x, y - fontSize);
          ctx.fillStyle = "rgba(34, 230, 130, 0.15)";
          ctx.fillText(chars[Math.floor(Math.random()*chars.length)], x, y - fontSize*2);
          if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.6 + Math.random() * 0.4;
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

        {title:"Diwan App", desc:"An encyclopedia of Muwashshahat and Andalusian heritage on your phone."},
        {title:"Andalus App", desc:"My flagship app with a smooth UX and an elegant Arabic interface."},
      ],
      download: "Download APK",
      timelineTitle: "Journey",
      timelineSub: "Selected milestones from my coding journey",
      timeline: [
        {year:"2024", title:"The Beginning", desc:"Learning HTML/CSS/JS and shipping first experimental pages."},
        {year:"2025", title:"Bot Development", desc:"Launching Discord & Telegram bots and offering automation services."},
        {year:"2025", title:"Andalus Apps", desc:"Publishing Arabic Android apps with elegant interfaces."},
        {year:"2026", title:"AI Integration", desc:"Embedding AI models into products and interfaces."},
      ],
      discordTitle: "Community & Automation",
      discordDesc: "Join the Discord server for bot projects and custom automation services.",
      discordBtn: "Join Server",
      contactTitle: "Let's work together", contactDesc: "Got a project in mind? Reach out directly",
      sendMail: "Email me", copyMail: "Copy email", copied: "Copied!",
      footer: "© 2026 Sami Charrak · Crafted with passion ☕️ + 💻",
      cmdNav: "Navigate", cmdLink: "Links", cmdAction: "Action",
    },
  };

  const projectIcons = ["film","link-2","book-open","sparkles","users","gamepad-2"];
  const projectUrls = [
    "https://samicharrak21-rgb.github.io/cinema.github.io/",
    "https://samicharrak21-rgb.github.io/social.github.io/",
    "https://samicharrak21-rgb.github.io/daywan.github.io/",
    "https://muslim2.lovable.app/",
    "https://novax2.up.railway.app/",
    "https://modern-artistry-flare.lovable.app/",
  ];
  const projectTags = [
    ["Web","UI","Entertainment"],
    ["Web","Landing"],
    ["Web","Heritage","Content"],
    ["Web","Islamic","UI"],
    ["Web","Social","Platform"],
    ["Web","Games","UI"],
  ];
  const appUrls = [
    {url:"https://www.mediafire.com/file/9rd479c44mi3t7n/app-release.apk/file", gradient:"linear-gradient(135deg,#10b981,#0d9488)"},
    {url:"https://www.mediafire.com/file/jong9a365qxcvh2/الديوان.apk/file", gradient:"linear-gradient(135deg,#84cc16,#22c55e)"},
  ];
  const statIcons = ["briefcase","calendar","coffee"];
  const statValues = [{end:10,suffix:""},{end:2,suffix:""},{end:99,suffix:"+"}];
  const skillIcons = ["code-2","bot","sparkles"];
  const socials = [
    {icon:"instagram", href:"https://www.instagram.com/s.xqg", label:"Instagram"},
    {icon:"twitter", href:"https://x.com/samicharrak21", label:"X / Twitter"},
    {icon:"github", href:"https://github.com/samicharrak-stack", label:"GitHub"},
    {icon:"send", href:"https://t.me/arabic_andalus", label:"Telegram"},
  ];

  let lang = localStorage.getItem("lang") || "ar";
  let isLight = localStorage.getItem("theme") === "light";
  if (isLight) document.documentElement.classList.add("light");
  let typeTimer = null;
  let activeFilter = "all";
  const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function startTyping(){
    clearTimeout(typeTimer);
    const phrases = T[lang].typedAr;
    const el = document.getElementById("typed");
    let pi = 0, ci = 0, deleting = false;
    function tick(){
      const cur = phrases[pi];
      if (!deleting){
        el.textContent = cur.slice(0, ++ci);
        if (ci === cur.length){ deleting = true; typeTimer = setTimeout(tick, 1600); return; }
      } else {
        el.textContent = cur.slice(0, --ci);
        if (ci === 0){ deleting = false; pi = (pi+1) % phrases.length; }
      }
      typeTimer = setTimeout(tick, deleting ? 35 : 70);
    }
    tick();
  }

  function renderProjects(){
    const tr = T[lang];
    const grid = document.getElementById("projectGrid");
    grid.innerHTML = tr.projects.map((p,i)=>{
      const tags = projectTags[i] || [];
      const visible = activeFilter === "all" || tags.includes(activeFilter);
      return `
      <a href="${projectUrls[i]}" target="_blank" rel="noreferrer" class="glass project spotlight ${visible?'':'hidden'}" data-tags="${tags.join(',')}">
        <div class="project-head">
          <div class="project-icon"><i data-lucide="${projectIcons[i]}" style="width:22px;height:22px;"></i></div>
          <i data-lucide="arrow-up-right" class="text-muted" style="width:18px;height:18px;"></i>
        </div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="project-tags">${tags.map(t=>`<span class="project-tag">${esc(t)}</span>`).join('')}</div>
      </a>`;
    }).join("");
    if (window.lucide) lucide.createIcons();
    bindSpotlight(grid);
    bindTilt(grid);
  }

  function renderFilters(){
    const tr = T[lang];
    const all = new Set();
    projectTags.forEach(arr => arr.forEach(t => all.add(t)));
    const tags = ["all", ...Array.from(all)];
    document.getElementById("filters").innerHTML = tags.map(t=>{
      const label = t === "all" ? tr.filterAll : t;
      return `<button class="filter-chip ${activeFilter===t?'active':''}" data-tag="${t}">${esc(label)}</button>`;
    }).join("");
    document.querySelectorAll(".filter-chip").forEach(b=>{
      b.addEventListener("click", ()=>{
        activeFilter = b.dataset.tag;
        renderFilters();
        renderProjects();
      });
    });
  }

  function applyLang(){
    const tr = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = lang === "ar" ? "سامي شراك · Portfolio 2026" : "Sami Charrak · Portfolio 2026";
    document.getElementById("langLabel").textContent = lang === "ar" ? "EN" : "ع";
    localStorage.setItem("lang", lang);

    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const k = el.getAttribute("data-i18n");
      if (tr[k] != null) el.textContent = tr[k];
    });

    document.getElementById("stats").innerHTML = statValues.map((v,i)=>`
      <div class="glass stat spotlight">
        <i data-lucide="${statIcons[i]}" class="text-primary" style="width:20px;height:20px;display:inline-block;margin-bottom:0.4rem;"></i>
        <div class="num gradient-text" data-counter="${v.end}" data-suffix="${v.suffix}">0${v.suffix}</div>
        <div class="lbl font-mono">${esc(tr.statsTitle[i])}</div>
      </div>`).join("");

    document.getElementById("skillsGrid").innerHTML = tr.skills.map((s,i)=>`
      <div class="glass skill spotlight">
        <div class="skill-icon" style="animation-delay:${i*0.4}s;"><i data-lucide="${skillIcons[i]}" style="width:24px;height:24px;"></i></div>
        <div class="skill-name">${esc(s)}</div>
      </div>`).join("");

    document.getElementById("langs").innerHTML = langs.map(([n,c])=>`<span class="chip"><span class="dot" style="background:${c};color:${c};"></span>${esc(n)}</span>`).join("");
    document.getElementById("tools").innerHTML = tools.map(([n,c])=>`<span class="chip"><span class="dot" style="background:${c};color:${c};"></span>${esc(n)}</span>`).join("");

    renderFilters();
    renderProjects();

    document.getElementById("appsGrid").innerHTML = tr.apps.map((a,i)=>`
      <div class="glass app spotlight">
        <div class="app-head">
          <div class="app-icon" style="background:${appUrls[i].gradient};"><i data-lucide="smartphone" style="width:24px;height:24px;"></i></div>
          <div class="app-meta">
            <h3>${esc(a.title)}</h3>
            <div class="t">Android · APK</div>
          </div>
        </div>
        <p>${esc(a.desc)}</p>
        <a href="${appUrls[i].url}" target="_blank" rel="noreferrer" class="btn" style="background:${appUrls[i].gradient};color:white;"><i data-lucide="download" style="width:18px;height:18px;"></i>${esc(tr.download)}</a>
      </div>`).join("");

    document.getElementById("timelineList").innerHTML = tr.timeline.map(t=>`
      <div class="tl-item">
        <div class="tl-year">${esc(t.year)}</div>
        <div class="tl-title">${esc(t.title)}</div>
        <div class="tl-desc">${esc(t.desc)}</div>
      </div>`).join("");

    document.getElementById("socials").innerHTML = socials.map(s=>`
      <a href="${s.href}" target="_blank" rel="noreferrer" aria-label="${s.label}" class="icon-btn"><i data-lucide="${s.icon}" style="width:18px;height:18px;"></i></a>`).join("");

    if (window.lucide) lucide.createIcons();
    runCounters();
    startTyping();
    bindSpotlight(document);
    buildCommands();
  }

  function runCounters(){
    document.querySelectorAll("[data-counter]").forEach(el=>{
      const end = parseInt(el.dataset.counter,10);
      const suffix = el.dataset.suffix || "";
      const start = performance.now();
      const tick = (now)=>{
        const p = Math.min(1,(now-start)/1400);
        const v = Math.round(end*(1-Math.pow(1-p,3)));
        el.textContent = v+suffix;
        if (p<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  /* Spotlight follow */
  function bindSpotlight(root){
    root.querySelectorAll(".spotlight").forEach(el=>{
      if (el._spot) return; el._spot = true;
      el.addEventListener("pointermove", (e)=>{
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", (e.clientX - r.left) + "px");
        el.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    });
  }

  /* 3D Tilt for project cards */
  function bindTilt(root){
    if (window.matchMedia("(hover: none)").matches || window.innerWidth < 900) return;
    root.querySelectorAll(".project").forEach(el=>{
      if (el._tilt) return; el._tilt = true;
      el.addEventListener("pointermove", (e)=>{
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = `perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-4px)`;
      });
      el.addEventListener("pointerleave", ()=>{ el.style.transform = ""; });
    });
  }

  /* Toast */
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  /* Command palette */
  let commands = [];
  let cmdActive = 0;
  function buildCommands(){
    const tr = T[lang];
    commands = [
      {label: tr.navAbout, group: tr.cmdNav, icon:"user", run:()=>scrollToId("about")},
      {label: tr.navSkills, group: tr.cmdNav, icon:"cpu", run:()=>scrollToId("skills")},
      {label: tr.navProjects, group: tr.cmdNav, icon:"rocket", run:()=>scrollToId("projects")},
      {label: tr.navJourney, group: tr.cmdNav, icon:"git-branch", run:()=>scrollToId("timeline")},
      {label: tr.navContact, group: tr.cmdNav, icon:"mail", run:()=>scrollToId("contact")},
      {label: tr.copyMail, group: tr.cmdAction, icon:"clipboard", run:async()=>{ try{await navigator.clipboard.writeText(EMAIL);}catch(e){} showToast(tr.copied); }},
      {label: lang==="ar"?"تبديل المظهر":"Toggle theme", group: tr.cmdAction, icon: isLight?"sun":"moon", run:()=>document.getElementById("themeBtn").click()},
      {label: lang==="ar"?"تبديل اللغة":"Toggle language", group: tr.cmdAction, icon:"languages", run:()=>document.getElementById("langBtn").click()},
      ...socials.map(s=>({label:s.label, group: tr.cmdLink, icon:s.icon, href:s.href})),
      {label: "Discord", group: tr.cmdLink, icon:"message-circle", href:"https://discord.gg/rq79jJxH45"},
      {label: "Email", group: tr.cmdLink, icon:"mail", href:"mailto:"+EMAIL},
    ];
  }
  function scrollToId(id){
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function renderCmd(filter=""){
    const list = document.getElementById("cmdList");
    const q = filter.trim().toLowerCase();
    const filtered = commands.filter(c=>!q || c.label.toLowerCase().includes(q) || (c.group||"").toLowerCase().includes(q));
    if (!filtered.length){
      list.innerHTML = `<div class="cmd-empty">${lang==="ar"?"لا توجد نتائج":"No results"}</div>`;
      return;
    }
    cmdActive = Math.min(cmdActive, filtered.length-1);
    list.innerHTML = filtered.map((c,i)=>`
      <div class="cmd-item ${i===cmdActive?'active':''}" data-i="${i}">
        <i data-lucide="${c.icon}" style="width:18px;height:18px;"></i>
        <span>${esc(c.label)}</span>
        <span class="meta">${esc(c.group||"")}</span>
      </div>`).join("");
    if (window.lucide) lucide.createIcons();
    list.querySelectorAll(".cmd-item").forEach(el=>{
      el.addEventListener("click", ()=>runCmd(filtered[parseInt(el.dataset.i)]));
      el.addEventListener("mouseenter", ()=>{ cmdActive = parseInt(el.dataset.i); refreshActive(filtered); });
    });
    list._filtered = filtered;
  }
  function refreshActive(filtered){
    document.querySelectorAll(".cmd-item").forEach((el,i)=>el.classList.toggle("active", i===cmdActive));
  }
  function runCmd(c){
    if (!c) return;
    closeCmd();
    if (c.href) window.open(c.href, "_blank", "noreferrer");
    else if (c.run) setTimeout(c.run, 100);
  }
  function openCmd(){
    document.getElementById("cmdOverlay").classList.add("open");
    const i = document.getElementById("cmdInput");
    i.value = ""; cmdActive = 0;
    renderCmd("");
    setTimeout(()=>i.focus(), 50);
  }
  function closeCmd(){ document.getElementById("cmdOverlay").classList.remove("open"); }

  function init(){
    buildFloatingIcons();
    buildCodeSnippets();
    if (window.lucide) lucide.createIcons();
    applyLang();

    document.getElementById("langBtn").addEventListener("click",()=>{
      lang = lang === "ar" ? "en" : "ar"; applyLang();
    });

    document.getElementById("themeBtn").addEventListener("click",()=>{
      document.documentElement.classList.toggle("light");
      isLight = !isLight;
      localStorage.setItem("theme", isLight ? "light" : "dark");
      const icon = document.getElementById("themeIcon");
      icon.setAttribute("data-lucide", isLight ? "sun" : "moon");
      if (window.lucide) lucide.createIcons();
      buildCommands();
    });

    document.getElementById("copyBtn").addEventListener("click", async ()=>{
      try { await navigator.clipboard.writeText(EMAIL); } catch(e){}
      const label = document.getElementById("copyLabel");
      label.textContent = T[lang].copied;
      document.getElementById("copyIcon").setAttribute("data-lucide","check");
      if (window.lucide) lucide.createIcons();
      showToast(T[lang].copied);
      setTimeout(()=>{
        label.textContent = T[lang].copyMail;
        document.getElementById("copyIcon").setAttribute("data-lucide","clipboard");
        if (window.lucide) lucide.createIcons();
      },1800);
    });

    /* Mobile menu */
    const nav = document.getElementById("nav");
    const menuToggle = document.getElementById("menuToggle");
    menuToggle.addEventListener("click", ()=>{
      const open = nav.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", open ? "true" : "false");
      document.getElementById("menuIcon").setAttribute("data-lucide", open ? "x" : "menu");
      if (window.lucide) lucide.createIcons();
    });
    nav.addEventListener("click", e=>{
      if (e.target.tagName === "A" && nav.classList.contains("open")){
        nav.classList.remove("open");
        menuToggle.setAttribute("aria-expanded","false");
        document.getElementById("menuIcon").setAttribute("data-lucide","menu");
        if (window.lucide) lucide.createIcons();
      }
    });

    /* Active nav link via scroll spy */
    const sections = ["about","skills","projects","timeline","contact"].map(id=>document.getElementById(id)).filter(Boolean);
    const navLinks = document.querySelectorAll(".nav-link");
    const spy = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if (en.isIntersecting){
          const id = en.target.id;
          navLinks.forEach(l=>l.classList.toggle("active", l.getAttribute("href") === "#"+id));
        }
      });
    }, {rootMargin: "-40% 0px -55% 0px", threshold: 0});
    sections.forEach(s=>spy.observe(s));

    /* Top button */
    const topBtn = document.getElementById("topBtn");
    function placeTop(){
      topBtn.style.left = topBtn.style.right = "";
      topBtn.style[document.documentElement.dir === "rtl" ? "left" : "right"] = "1.5rem";
    }
    placeTop();
    topBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

    /* Reveal on scroll */
    const reveals = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if (e.isIntersecting){ e.target.classList.add("is-visible"); io.unobserve(e.target);} });
    },{threshold:0.12});
    reveals.forEach(r=>io.observe(r));

    /* Scroll progress + top btn */
    let ticking = false;
    window.addEventListener("scroll",()=>{
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(()=>{
        const h = document.documentElement;
        const p = (h.scrollTop)/(h.scrollHeight - h.clientHeight) * 100;
        document.getElementById("progress").style.width = p + "%";
        topBtn.classList.toggle("show", window.scrollY > 600);
        ticking = false;
      });
    },{passive:true});

    /* Command palette */
    const overlay = document.getElementById("cmdOverlay");
    document.getElementById("cmdBtn").addEventListener("click", openCmd);
    overlay.addEventListener("click", e=>{ if (e.target === overlay) closeCmd(); });
    document.getElementById("cmdInput").addEventListener("input", e=>{ cmdActive = 0; renderCmd(e.target.value); });
    document.getElementById("cmdInput").addEventListener("keydown", e=>{
      const list = document.getElementById("cmdList")._filtered || [];
      if (e.key === "ArrowDown"){ e.preventDefault(); cmdActive = (cmdActive+1) % list.length; refreshActive(list); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); cmdActive = (cmdActive-1+list.length) % list.length; refreshActive(list); }
      else if (e.key === "Enter"){ e.preventDefault(); runCmd(list[cmdActive]); }
      else if (e.key === "Escape"){ closeCmd(); }
    });
    window.addEventListener("keydown", e=>{
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openCmd(); }
      else if (e.key === "Escape") closeCmd();
      else if (e.key === "/" && document.activeElement === document.body){ e.preventDefault(); openCmd(); }
    });

    /* Update top btn placement when language toggles */
    new MutationObserver(placeTop).observe(document.documentElement, {attributes:true, attributeFilter:["dir"]});
  }

  if (document.readyState !== "loading" && window.lucide) init();
  else window.addEventListener("load", init);
</script>
</body>
